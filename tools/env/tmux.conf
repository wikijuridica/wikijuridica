# TMux Config - otimizado para terminal moderno + IAs
# Fluidez com WezTerm/Alacritty/kitty + tmux

# Cores e terminal (true color)
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",wezterm:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -ag terminal-overrides ",alacritty:RGB"
set -ag terminal-overrides ",alacritty:Tc"
set -ag terminal-overrides ",xterm-kitty:RGB"
set -ag terminal-overrides ",xterm-kitty:Tc"
set -ag terminal-overrides ",wezterm:RGB"
set -ag terminal-overrides ",wezterm:Tc"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",xterm-256color:Tc"

# Performance e responsividade
# escape-time 10 (nao 0): margem minima p/ nao misparse de ESC-sequences sob
# carga concorrente pesada; imperceptivel ao humano, remove o delay legado.
set -sg escape-time 10
set -g focus-events on
set -g aggressive-resize off
set -g status-interval 30

# Teclas estendidas (CSI-u): deixa os TUIs (claude/codex) distinguirem
# Shift+Enter, Ctrl+Enter e Ctrl+<tecla>. So afeta apps que negociam; os demais
# recebem teclas legadas — puramente aditivo, nao quebra nada.
set -s extended-keys on
set -as terminal-features ',xterm-256color:extkeys'
# Nao suprimir teclas rapidas de drivers programaticos como se fossem paste
# (wezterm ja usa bracketed paste p/ paste real).
set -g assume-paste-time 0
set -g set-titles on
# As chaves de repeticao ({8}, {4}...) quebram o parser de formato do tmux e o
# titulo saia VAZIO. Mesma intencao (esconder UUID de sessao, mostrar "AI
# Terminal"), escrita com classes simples — testado no tmux 3.5a.
set -g set-titles-string "#{?#{m/r:^[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+-[0-9a-fA-F]+$,#{pane_title}},AI Terminal,#{pane_title}}"
# allow-rename fica definido UMA vez, no bloco AI TERMINAL no fim do arquivo
# (valor efetivo: off, para o endereco de janela do ai-pane nao mudar sozinho).
# Chave repetida em dois pontos do arquivo e armadilha: quem edita o primeiro
# ponto acha que mudou algo e o segundo continua vencendo silenciosamente.
setw -g automatic-rename off

# Historico por pane. 50000 foi escolhido supondo "dezenas de MB, trivial" — a
# medicao desmentiu: ~1.05 KB por linha, ou seja ate ~50 MB POR PANE saturado.
# Com 20-50 panes de agente sao 0,5-2,6 GB concentrados num unico processo (o
# servidor tmux), que nao esta na lista de protecao do earlyoom — exatamente o
# perfil que congelou a maquina em 2026-07-15.
# 10000 (~10 MB/pane) cobre com folga build log e diff; quem precisar de mais
# eleva SO no pane que precisa com `prefix + H`. Vale apenas para panes novos.
set -g history-limit 10000
bind H set -p history-limit 200000 \; display 'history deste pane: 200000 linhas'

# Clipboard - 'on' faz o tmux EMITIR OSC52 ao copiar (mouse/copy-mode),
# levando a selecao ao clipboard do sistema via wezterm. 'external' NAO emitia,
# por isso a copia nao chegava ao clipboard. Ms (OSC52) ja existe no terminfo.
set -g set-clipboard on
# Garante que o wezterm receba OSC52 mesmo com TERM interno tmux-256color.
set -ag terminal-features ',wezterm:clipboard'
set -ag terminal-features ',xterm-256color:clipboard'

# Habilitar mouse
set -g mouse on

# Elite/estabilidade: deixa apps (claude/codex) passarem sequences modernas ao
# wezterm (OSC52 direto, hyperlinks OSC8, graphics) sem o tmux barrar. Sem limitar.
set -g allow-passthrough on
set -as terminal-features ',*:hyperlinks'

# Começar numeração em 1 (mais intuitivo)
set -g base-index 1
setw -g pane-base-index 1

# Renumerar janelas automaticamente
set -g renumber-windows on

# Atalhos mais intuitivos
# Prefix: Ctrl+a (mais fácil que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Dividir painéis com | e -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Nova janela no diretório atual
bind c new-window -c "#{pane_current_path}"

# Navegar entre painéis com Alt+setas (sem prefix).
# Mantido: Alt+setas quase nao e usado por TUI, entao o atalho nao rouba nada.
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# `source-file` nao apaga binding que ja existe na memoria do servidor — apenas
# remover a linha do arquivo deixaria Ctrl+seta preso em toda sessao viva. O
# unbind explicito torna o reload idempotente.
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down

# Redimensionar: movido de Ctrl+setas (tabela root) para o prefix.
# Ctrl+seta na tabela root era capturado pelo tmux ANTES de chegar a qualquer
# aplicacao — inclusive ao prompt do Claude Code, onde Ctrl+esquerda/direita e
# "pular uma palavra". Editar texto no prompt ficava quebrado sem causa aparente.
# Com -r da para repetir (prefix uma vez, depois so as setas).
bind -r Left  resize-pane -L 2
bind -r Right resize-pane -R 2
bind -r Up    resize-pane -U 2
bind -r Down  resize-pane -D 2

# Recarregar config
bind r source-file ~/.tmux.conf \; display "Config recarregada!"

# Modo de cópia com vi keys (útil para navegar outputs longos)
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Atalho para entrar no modo scroll (Prefix + [)
bind [ copy-mode

# --- Visual minimalista ---

# Barra de status
set -g status-position bottom
set -g status-style 'bg=#000000 fg=#6f737a'
set -g status-left-length 30
set -g status-right-length 50

set -g status-left '#[fg=#6f737a] #S '
# status-right definido UMA vez, no bloco AI TERMINAL no fim do arquivo (inclui
# saturacao e tokens). Duas definicoes da mesma chave escondem qual esta valendo.

# Janelas na barra
setw -g window-status-format '#[fg=#555753] #I:#W '
setw -g window-status-current-format '#[fg=#8ab4f8,bold] #I:#W '
setw -g window-status-separator ''

# Painéis
set -g pane-border-style 'fg=#404040'
set -g pane-active-border-style 'fg=#569cd6'

# Mensagens
set -g message-style 'bg=#569cd6 fg=#1e1e1e bold'

# ═══ AI TERMINAL — operacao multi-agente (2026-07-28) ════════════════════════
# Bloco ADITIVO: nao remove nem inverte nenhuma opcao acima. Validado antes de
# entrar aqui num servidor tmux isolado (tmux -L probe -f ...), nunca no servidor
# do dono — erro de sintaxe no meio de um source-file deixa config pela metade.

# --- enderecamento ESTAVEL de janela (base do protocolo `ai-pane`) ------------
# allow-rename ON permitia a aplicacao renomear a janela por escape sequence.
# Como o agente endereca a janela pelo NOME (ai-pane usa "sessao:=nome"), uma
# renomeacao espontanea no meio do trabalho faz o endereco apontar para o nada.
# OFF congela o nome dado pelo operador. NAO afeta o titulo do WezTerm, que le
# #{pane_title} via OSC 0/2 — esse segue livre (set-titles-string acima intacto).
set -g allow-rename off

# --- visibilidade de frota ---------------------------------------------------
# Janela que produziu saida fica marcada na barra: com muitas frentes abertas,
# e assim que se ve quem avancou. visual-activity off = sem popup interrompendo.
setw -g monitor-activity on
set -g visual-activity off

# Saturacao ao vivo na barra (RAM/load/nº de claudes/agentes). `ai-status` le
# /proc direto: medido em ~14ms por execucao, 1x a cada status-interval (30s).
set -g status-right '#[fg=#6f737a]#(ai-status) #[fg=#555753]%H:%M #[fg=#6f737a]%d/%m '
set -g status-right-length 90

# Fechar a ultima janela de uma sessao nao expulsa o dono do tmux: ele cai em
# outra sessao viva. Com varias frentes abertas, ser jogado para o shell perde o
# contexto visual de tudo que estava rodando.
set -g detach-on-destroy off

# --- atalhos de frota (prefix Ctrl+A) ----------------------------------------
bind A run-shell 'ai-pane grid 4'      # cria/reutiliza 4 janelas de agente ag1..ag4
bind M select-window -t '=mon'         # painel de saturacao (ai-top)
bind C select-window -t '=claude'      # volta para a TUI do Claude Code
bind E select-layout tiled             # grade uniforme
bind S setw synchronize-panes \; display 'synchronize-panes: #{?pane_synchronized,ON,OFF}'
bind P display-popup -E -w 70% -h 60% 'ai-pane list; echo; echo "[qualquer tecla fecha]"; read -rsn1'

# Soltar o botao do mouse nao descarta a selecao recem-feita.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# ═══ SESSÃO ABANDONADA — não deixar Claude Code pendurado (2026-08-19) ═══════
# Bloco ADITIVO. Nada acima é removido ou invertido.
#
# O tmux sobrevive ao fechamento do terminal — é o que ele existe para fazer — e
# o launcher cria uma sessão NOVA por janela (`ai-<timestamp>-<pid>`). A soma das
# duas coisas é que fechar a janela do WezTerm deixa a sessão viva, sem cliente,
# com o Claude Code inteiro dentro dela. Medido em 2026-08-19: 18 sessões
# acumuladas em quatro dias, quatro delas segurando Claude Code, ~6 GB de RAM e
# 6,5 GB de swap. O dono via isso como "MCP órfão".
#
# A limpeza NÃO é feita por hook daqui, de propósito. `destroy-unattached on`
# mataria a sessão no instante do detach — inclusive o detach deliberado de quem
# quer deixar um agente trabalhando. Quem decide é `ai-session-reaper`, no timer
# do systemd a cada 15 min, que só encerra sessão detached, sem trabalho em voo e
# parada há mais de 90 min (15 min se for casca vazia).
set -g destroy-unattached off

# Prefix + K: marca/desmarca ESTA sessão como permanente. Sessão marcada nunca é
# encerrada pelo reaper, por mais tempo que fique detached — é o jeito de dizer
# "deixe rodando, eu volto".
bind K if -F '#{@ai_keep}' \
  { set -u @ai_keep ; display 'sessao volta a ser reciclavel pelo reaper' } \
  { set @ai_keep 1  ; display 'sessao marcada @ai_keep: o reaper nao encerra' }

# Prefix + Ctrl+K: mostra o que o reaper faria agora, sem executar nada.
# Não usa `D`: essa é `choose-client` e já está em uso na config acima.
bind C-k display-popup -E -w 80% -h 50% \
  'ai-session-reaper; echo; echo "[qualquer tecla fecha]"; read -rsn1'

# Indicador na barra: a sessão marcada mostra um cadeado, para não haver dúvida
# sobre qual está protegida.
set -ga status-left '#{?@ai_keep,#[fg=#8ab4f8]  ,}'
