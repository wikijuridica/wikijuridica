# Exceções que valem para o go.mod DO PRODUTO.
#
# POR QUE UM ARQUIVO SEPARADO DE tools/sca/osv-scanner.toml. Aquele registra
# exceções de dependências que só existem para RODAR as ferramentas de análise
# (osv-scanner traz cliente Docker, e as cinco CVEs de lá são todas dele). Passar
# aquele arquivo ao scan do produto faria as exceções de ferramenta valerem para
# o binário que vai ao ar — e é justamente o que não pode acontecer.
#
# Medido em 2026-08-29: `internal/checks/checks.go:9951` roda o scan do root com
# `--lockfile go.mod` e SEM `--config`. Era o desenho conservador — nada se
# ignora no produto —, mas ele também tornava impossível registrar exceção
# fundamentada para o root: a CVE ficava vermelha para sempre, mesmo com
# evidência de que o código vulnerável não é alcançado, e gate cronicamente
# vermelho é gate que se para de ler.
#
# Este arquivo é a saída: exceção do produto existe, é separada, e cada entrada
# passa pelo mesmo `sca-osv-ignore-policy` — com `ignoreUntil` obrigatório e
# janela máxima de 45 dias.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "codigo nao alcancado: o subpacote vulneravel golang.org/x/crypto/openpgp nao e importado por pacote algum do projeto -- grep -rn \"x/crypto/openpgp\" --include=*.go internal/ cmd/ devolve 0 ocorrencias, e go mod why golang.org/x/crypto responde \"main module does not need package\". Nao ha release corrigida publicada: go list -m -versions termina em v0.55.0, que e a propria versao afetada. Reavaliar quando x/crypto publicar versao nova."
ignoreUntil = "2026-10-05T00:00:00Z"
