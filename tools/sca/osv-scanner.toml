# GO-2026-5932 — golang.org/x/crypto v0.55.0, subpacote openpgp.
#
# Esta e a UNICA excecao deste arquivo que nao e "tools/sca only": ela alcanca o
# go.mod do proprio projeto. Por isso o fundamento vai medido, e nao alegado.
#
#   1. O SUBPACOTE VULNERAVEL NAO E IMPORTADO. A CVE afeta
#      golang.org/x/crypto/openpgp (e openpgp/packet). Medido em 2026-08-29:
#      `grep -rn "x/crypto/openpgp" --include='*.go' internal/ cmd/` devolve
#      ZERO ocorrencias. O codigo vulneravel nao entra em binario nenhum.
#   2. O MODULO NEM PRECISA DE x/crypto DIRETAMENTE: `go mod why
#      golang.org/x/crypto` responde "(main module does not need package
#      golang.org/x/crypto)". Ela chega como transitiva.
#   3. NAO EXISTE VERSAO CORRIGIDA PARA SUBIR. `go list -m -versions
#      golang.org/x/crypto` termina em v0.55.0 -- que e a versao afetada. A
#      correcao prescrita no catalogo da caca ("subir a versao corrigida") nao e
#      executavel hoje, e isso e o que esta excecao registra.
#
# ignoreUntil curto de proposito: a data forca reavaliar quando a x/crypto
# publicar release nova, e o gate `sca-osv-ignore-policy` REPROVA excecao
# expirada. Excecao sem expiracao seria o gate relaxado que o contrato proibe,
# so que com boa caligrafia.
[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "codigo nao alcancado: o subpacote vulneravel golang.org/x/crypto/openpgp nao e importado por pacote algum do projeto -- grep -rn \"x/crypto/openpgp\" --include=*.go internal/ cmd/ devolve 0 ocorrencias, e go mod why golang.org/x/crypto responde \"main module does not need package\". Nao ha release corrigida publicada: go list -m -versions termina em v0.55.0, que e a propria versao afetada. Reavaliar quando x/crypto publicar versao nova."
ignoreUntil = "2026-10-05T00:00:00Z"

# ─── containerd v1.7.34 no tools/sca/scorecard ────────────────────────────────
#
# GO-2026-5064, GO-2026-5338 e GO-2026-5622 — github.com/containerd/containerd
# v1.7.34, transitivo do scorecard. Fundamento MEDIDO em 2026-08-29, ponto a
# ponto, e nao alegado:
#
#   1. E FERRAMENTA, nao produto. O modulo aparece apenas em
#      tools/sca/scorecard/go.mod. O go.mod do projeto nao o alcanca: o scan do
#      produto (`sca_osv_root`) usa `--lockfile go.mod` com config PROPRIA
#      (tools/sca/osv-scanner-root.toml) e NAO le este arquivo. Nada aqui
#      afrouxa o que vai ao ar.
#
#   2. O CAMINHO VULNERAVEL NAO E EXERCIDO. `go mod why` dentro de
#      tools/sca/scorecard devolve a cadeia:
#
#        github.com/ossf/scorecard/v5
#          -> github.com/google/osv-scanner/v2/pkg/osvscanner
#          -> github.com/google/osv-scalibr/binary/proto
#          -> github.com/google/osv-scalibr/extractor/filesystem/containers/containerd
#          -> github.com/containerd/containerd/metadata
#
#      Ou seja: o EXTRATOR DE CONTAINERS do proprio scanner. Todos os cinco
#      comandos do gate sao `scan source --lockfile <go.mod>` — medido:
#      `grep -cE '"scan", "image"|--docker|scan image' internal/checks/checks.go`
#      devolve ZERO. Nunca escaneamos imagem nem container, entao o extrator
#      nao entra no caminho de execucao.
#
#   3. NAO HA VERSAO CORRIGIDA PARA SUBIR NA LINHA ATUAL.
#      `go list -m -versions github.com/containerd/containerd` termina em
#      v1.7.34 — a propria versao afetada. Subir exigiria a linha 2.x, que e
#      major do containerd puxada por dependencia transitiva de terceiro; nao
#      esta ao nosso alcance sem trocar o scorecard.
#
# ★ O QUE ISTO NAO E: nao e "ignorar CVE para ficar verde". A distincao que o
# repositorio faz e entre PRODUTO e FERRAMENTA, e ela ja existe no desenho do
# gate — labels e configs separados. O que faltava era a excecao FUNDAMENTADA
# para a ferramenta, sem a qual o gate fica cronicamente vermelho — e gate
# cronicamente vermelho e gate que se para de ler, que e como um vermelho de
# produto passaria despercebido no meio do ruido.
#
# O prazo e curto de proposito: em 2026-10-05 a excecao expira e a medicao tem
# de ser refeita. Excecao sem prazo vira permissao.

[[IgnoredVulns]]
id = "GO-2026-5064"
reason = "tools/sca + transitive: containerd v1.7.34 no tools/sca/scorecard/go.mod, via osv-scalibr container extractor. O codigo vulneravel nao e importado pelo produto — `go mod why -m github.com/containerd/containerd` no go.mod do projeto responde que o modulo principal nao precisa dele, e o modulo so aparece no lockfile da ferramenta. MIGRACAO TENTADA E BLOQUEADA POR TERCEIRO (2026-08-29, seis caminhos medidos): buildkit v0.28.1 tem o fix mas exige runtime-spec v1.3.0, com o qual containerd v1.7.34 nao compila; v1.7.34 e o fim da linha 1.x; subir osv-scalibr para v0.5.3 (que ja usa containerd/v2) arrasta actionlint v1.7.9->v1.7.12 e AMBOS falham com `undefined: yaml.ParserError`; instalar goccy/go-yaml explicitamente nao resolveu. Destrava quando o actionlint publicar versao compativel — por isso o prazo."
ignoreUntil = "2026-10-05T00:00:00Z"

